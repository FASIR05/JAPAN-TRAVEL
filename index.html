
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本行｜PDF 文件資料庫</title>

<style>
:root{
  --bg:#f6f8fb;
  --surface:#fff;
  --text:#182230;
  --muted:#667085;
  --line:#e7ebf0;
  --accent:#315bce;
  --shadow:0 8px 28px rgba(24,34,48,.06)
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,
  "Segoe UI","Noto Sans TC",sans-serif
}
.wrap{max-width:1080px;margin:auto;padding:32px 22px 60px}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:54px
}
.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:18px}
.logo{
  width:40px;height:40px;border-radius:13px;
  background:#182b4d;color:#fff;
  display:grid;place-items:center;font-size:20px
}
.pill{
  font-size:13px;color:var(--muted);
  background:#fff;border:1px solid var(--line);
  padding:7px 12px;border-radius:999px
}
.hero{max-width:680px;margin-bottom:34px}
.eyebrow{
  font-size:12px;font-weight:700;
  letter-spacing:.14em;color:var(--accent)
}
h1{font-size:clamp(32px,5vw,48px);line-height:1.18;margin:10px 0 14px}
.sub{color:var(--muted);margin:0}
.searchbox{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:0 16px;max-width:620px;
  box-shadow:var(--shadow);margin:28px 0 36px
}
.searchbox span{font-size:19px;color:var(--muted)}
input{
  border:0;outline:0;width:100%;
  padding:17px 0;font:inherit;background:transparent;color:var(--text)
}
.section-head{
  display:flex;align-items:end;justify-content:space-between;
  margin:30px 0 16px
}
.section-head h2{font-size:19px;margin:0}
.section-head p{font-size:13px;color:var(--muted);margin:0}
.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.doc{
  display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:16px;text-decoration:none;
  transition:.18s;min-width:0
}
.doc:hover{border-color:#b7c5ee;box-shadow:var(--shadow)}
.pdficon{
  flex:none;width:42px;height:46px;border-radius:10px;
  background:#fff0ef;color:#c83e36;
  display:grid;place-items:center;font-size:12px;font-weight:800
}
.doc-info{min-width:0;flex:1}
.doc-title{
  font-weight:650;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}
.doc-meta{
  font-size:13px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.open{color:var(--muted);font-size:19px}
.empty{
  grid-column:1/-1;background:#fff;
  border:1px dashed var(--line);border-radius:14px;
  padding:28px;text-align:center;color:var(--muted)
}
footer{
  margin-top:58px;padding-top:20px;
  border-top:1px solid var(--line);
  display:flex;justify-content:space-between;
  color:var(--muted);font-size:13px
}
@media(max-width:760px){
  .docs{grid-template-columns:1fr}
  header{margin-bottom:38px}
  .wrap{padding:22px 16px 40px}
}
</style>
</head>

<body>
<div class="wrap">

<header>
  <div class="brand">
    <div class="logo">▤</div>
    <span>日本行</span>
  </div>
</header>

<main>
  <section class="hero">
    <h1>FUKUOKA</h1>
    <label class="searchbox">
      <span>⌕</span>
      <input id="search" type="search"
      placeholder="搜尋文件名稱或分類…" aria-label="搜尋文件">
    </label>
  </section>

  <section>
    <div class="section-head">
      <h2>所有文件</h2>
      <p id="resultCount"></p>
    </div>
    <div class="docs" id="docs"></div>
  </section>
</main>

<footer>
  <span>日本行</span>
</footer>

</div>

<script>
// 新增或刪除文件，只需要編輯這個陣列
const documents = [
  {title:"機票明細",category:"機票",url:"https://drive.google.com/file/d/1IIkXwMe1d9NZ5TUe8skR6dhKwHtGvXLG/view?usp=drive_link"},
  {title:"行程",category:"行程規劃",url:"https://drive.google.com/file/d/1ZSia4mwkUbYBJtNnNK4GQ5v9PwHNVM62/view?usp=drive_link"},
  {title:"氣象",category:"天氣資訊",url:"https://drive.google.com/file/d/1bjMuFe0OuDqHDWwseghTa0h0OoJnAs27/view?usp=drive_link"},
  {title:"日本電器電壓",category:"旅遊須知",url:"https://docs.google.com/document/d/1ERta7fEzX4oXtgaiGCq6s6jyd6ch-COs/edit?usp=drive_link&ouid=104072480900914771692&rtpof=true&sd=true"},
  {title:"日本付款方式須知",category:"旅遊須知",url:"https://drive.google.com/file/d/1B86QqbpqH2TZtY9dekNytUHwc-dbqH5Y/view?usp=drive_link"},
  {title:"退稅方式",category:"購物資訊",url:"https://drive.google.com/file/d/1PX4hrS4vygpCaw-F3UTKwgzUwBq4fksK/view?usp=drive_link"},
  {title:"保險",category:"保險資訊",url:"https://drive.google.com/file/d/1XZdJk9sXSwYPOsW7FUeRqGqCRXEKXutl/view?usp=drive_link"},
  {title:"TOKIO OMOTENASHI POLICY",category:"保險資訊",url:"https://drive.google.com/open?id=1hsn58iZhIlx_InUqxmpguBVm6wxyv4Wr&usp=drive_copy"},
  {title:"保險新聞案例",category:"保險資訊",url:"https://drive.google.com/file/d/1OFi9iYn-zA3lF97Av7fDrY_k-AFWFk7o/view?usp=drive_link"}
];

const docsEl=document.getElementById("docs");
const searchEl=document.getElementById("search");

function renderDocs(){
  const q=searchEl.value.trim().toLocaleLowerCase();

  const filtered=documents.filter(d=>
    `${d.title} ${d.category}`.toLocaleLowerCase().includes(q)
  );

  document.getElementById("resultCount").textContent=
    `共 ${filtered.length} 份`;

  docsEl.innerHTML="";

  if(!filtered.length){
    const empty=document.createElement("div");
    empty.className="empty";
    empty.textContent="找不到符合條件的文件，試試其他關鍵字。";
    docsEl.appendChild(empty);
    return;
  }

  filtered.forEach(d=>{
    const link=document.createElement("a");
    link.className="doc";
    link.href=d.url;
    link.target="_blank";
    link.rel="noopener noreferrer";

    const icon=document.createElement("div");
    icon.className="pdficon";
    icon.textContent="FILE";

    const info=document.createElement("div");
    info.className="doc-info";

    const title=document.createElement("div");
    title.className="doc-title";
    title.textContent=d.title;

    const meta=document.createElement("div");
    meta.className="doc-meta";
    meta.textContent=d.category;

    info.append(title,meta);

    const arrow=document.createElement("div");
    arrow.className="open";
    arrow.textContent="↗";

    link.append(icon,info,arrow);
    docsEl.appendChild(link);
  });
}

searchEl.addEventListener("input",renderDocs);
renderDocs();
</script>

</body>
</html>
